<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema - ICU UAGRM</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body class="login-body">
    <!-- El wrapper asegura el centrado perfecto en móviles y PC -->
    <div class="login-wrapper">
        <div class="login-box">
            <!-- La imagen ahora tiene controles estrictos -->
            <img src="/img/icu_solo.png" alt="Logo UAGRM" class="logo-institucional">
            
            <h2>Sistema Documental ICU</h2>
            
            <form action="/login" method="POST" class="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="codigo">Registro / Código:</label>
                    <input type="number" id="codigo" name="codigo" required placeholder="Ingrese su código">
                </div>
                
                <div class="form-group" style="text-align: left; margin-top: 15px;">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" required placeholder="Ingrese su contraseña">
                </div>
                
                <button type="submit" class="cta-button" style="width: 100%; margin-top: 25px; border-radius: 4px;">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
